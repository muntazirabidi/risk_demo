services:
  - type: web
    name: risk-demo-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OPENAI_MODEL
        value: gpt-4-turbo-preview
      # Add these in Render dashboard:
      # - OPENAI_API_KEY
      # - ALLOWED_ORIGINS

